<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hinoki Learn</title>
  <meta name="theme-color" content="#2f5d46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hinoki Learn">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
  <!-- ?v=8: đổi cùng VERSION trong sw.js, để trình duyệt không trộn file cũ với file mới -->
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <div id="banner" class="banner" hidden></div>

  <!-- Đăng nhập -->
  <section id="v-login" class="view">
    <div class="wrap center">
      <img src="icons/icon.svg" alt="" class="logo">
      <h1>Hinoki Learn</h1>
      <p class="muted">Ôn tiếng Nhật mỗi ngày 5-10 phút</p>
      <form id="f-login" class="card form" autocomplete="off">
        <label>Mã học viên
          <input id="in-ma" inputmode="text" placeholder="HV01" maxlength="6" required autocapitalize="characters">
        </label>
        <label>Mã PIN (4 số)
          <input id="in-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••" required>
        </label>
        <button class="btn primary big" type="submit">Vào học</button>
        <p id="login-err" class="err" role="alert"></p>
      </form>
      <p class="small"><a href="#giao-vien">Trang giáo viên</a> · <a href="#" id="lnk-server">Cài đặt máy chủ</a></p>
    </div>
  </section>

  <!-- Trang chủ học viên -->
  <section id="v-home" class="view app-view" hidden>
    <header class="app-top">
      <div class="brand"><span class="seal" aria-hidden="true">檜</span><span>Hinoki Learn</span></div>
      <span id="home-ma" class="chip"></span>
      <button id="btn-logout" class="icon-btn" type="button">Đăng xuất</button>
    </header>
    <div class="app-scroll">
      <div id="home-hero"></div>
      <div id="decks" class="decks"></div>
      <p id="home-note" class="muted center small"></p>
    </div>
    <div class="app-bottom">
      <button id="btn-start" class="cta" type="button">Học ngay</button>
    </div>
  </section>

  <!-- Ôn thẻ -->
  <section id="v-review" class="view app-view" hidden>
    <header class="app-top">
      <button id="btn-quit" class="icon-btn" type="button" aria-label="Dừng, về trang chính"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Dừng</button>
      <div id="counts" class="counts" aria-label="Thẻ mới, đang học, cần ôn"></div>
      <span class="top-spacer"></span>
    </header>
    <div id="flash" class="flash" tabindex="0">
      <span id="c-deck" class="deck-tag"></span>
      <div id="c-pic" class="pic"></div>
      <div id="c-front" class="front"></div>
      <div id="c-back" class="back" hidden>
        <div id="c-read" class="read"></div>
        <div id="c-mean" class="mean"></div>
        <dl id="c-kanji" class="kanji-meta" hidden></dl>
        <div id="c-ex" class="ex"></div>
      </div>
    </div>
    <div class="tools">
      <button id="btn-speak" class="icon-btn boxed" type="button" aria-label="Nghe phát âm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>Nghe</button>
      <button id="btn-write" class="icon-btn boxed" type="button" aria-label="Xem cách viết chữ" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>Cách viết</button>
    </div>
    <div class="app-bottom plain">
      <div id="act-flip">
        <p id="flip-hint" class="hint">Nghĩ ra nghĩa trước, rồi mới lật</p>
        <button id="btn-flip" class="cta soft" type="button">Hiện đáp án</button>
      </div>
      <div id="act-rate4" class="rate4" hidden>
        <button class="g1" type="button" data-r="1"><b>Quên</b><i></i></button>
        <button class="g2" type="button" data-r="2"><b>Khó</b><i></i></button>
        <button class="g3" type="button" data-r="3"><b>Được</b><i></i></button>
        <button class="g4" type="button" data-r="4"><b>Dễ</b><i></i></button>
      </div>
      <div id="act-rate2" class="rate2" hidden>
        <button class="kno" type="button" data-r="1">Chưa nhớ</button>
        <button class="kyes" type="button" data-r="3">Nhớ rồi!</button>
      </div>
    </div>
  </section>

  <!-- Xong phiên -->
  <section id="v-done" class="view app-view" hidden>
    <header class="app-top">
      <div class="brand"><span class="seal" aria-hidden="true">檜</span><span>Hinoki Learn</span></div>
    </header>
    <div class="done">
      <div id="done-art" class="hanko" aria-hidden="true">済</div>
      <h2 id="done-title"></h2>
      <p id="done-txt" class="muted"></p>
      <div id="done-sum" class="sum"></div>
      <p id="sync-txt" class="small muted"></p>
    </div>
    <div class="app-bottom plain">
      <button id="btn-home" class="cta" type="button">Về trang chính</button>
    </div>
  </section>

  <!-- Trang giáo viên -->
  <section id="v-teacher" class="view" hidden>
    <div class="wrap wide">
      <header class="top">
        <h2>Trang giáo viên</h2>
        <a href="#" class="btn ghost small" id="t-back">Thoát</a>
      </header>
      <form id="f-teacher" class="card form">
        <label>Mã giáo viên
          <input id="in-tkey" type="password" required>
        </label>
        <button class="btn primary" type="submit">Xem tiến độ</button>
        <p id="t-err" class="err" role="alert"></p>
      </form>
      <div id="t-out"></div>
    </div>
  </section>

  <!-- Cài đặt máy chủ -->
  <dialog id="dlg-server">
    <form method="dialog" class="form">
      <h3>Cài đặt máy chủ</h3>
      <p class="small">Dán địa chỉ Web App của Google Apps Script (bắt đầu bằng https://script.google.com/). Để trống = chế độ DEMO.</p>
      <input id="in-api" placeholder="https://script.google.com/macros/s/.../exec">
      <div class="row">
        <button value="cancel" class="btn ghost">Hủy</button>
        <button value="ok" class="btn primary" id="btn-save-api">Lưu</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/ts-fsrs-6.0.0.umd.js?v=8"></script>
  <script src="demo-cards.js?v=8"></script>
  <script src="kana-strokes.js?v=8"></script>
  <script src="viet-chu.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
